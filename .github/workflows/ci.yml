name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run by hand from the Actions tab, e.g. when GitHub drops a run.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Actions are pinned to commit SHAs, since tags can be moved.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test

  # Trunk-based: a push to main that carries changesets releases right away.
  # `npm run release` versions them, commits "Version packages" to main, then
  # tags and creates the GitHub releases, the same as on your machine. Its
  # push uses the workflow token, so it doesn't start another run. A manual
  # run on main releases the same way.
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # existing tags tell changeset publish what's already released
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false # no shared cache in a job that can write to the repo
      - run: npm ci --ignore-scripts
      - name: Git identity for the version commit and tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Version, tag and release
        run: npm run release
        env:
          GH_TOKEN: ${{ github.token }}
